name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install disposable mount VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio e2fsprogs dosfstools kmod linux-image-virtual shellcheck dialog
      - name: Validate image, release, shell and dialog contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Qualify cleanup with real mounts and interruptions
        run: |
          vm_kernel="$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -n 1)"
          test -n "$vm_kernel"
          sudo install -m 0644 "$vm_kernel" "$RUNNER_TEMP/server-mount-kernel"
          vm_version="${vm_kernel##*/vmlinuz-}"
          /usr/bin/python3 scripts/check-server-mount-vm.py --kernel "$RUNNER_TEMP/server-mount-kernel" --modules-dir "/lib/modules/$vm_version" --log "$RUNNER_TEMP/server-mount-vm.log"
