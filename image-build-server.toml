schema = 1

[image]
# Must match the literal top-level <image name="..."> in kiwi/config.xml.
# release-server.toml's own image_name ("lyra-os-server") is the source of
# truth for the actual output ISO filename; kiwi/test/build-and-run-vm.sh
# renames the kiwi-ng output to match it after the build.
name = "lyra-os"
description = "config.xml"
architecture = "x86_64"

[source]
repository = "https://github.com/lyra-os-linux/lyraos-server"

[distribution]
iso_provider = "sourceforge"

[obs]
api_url = "https://api.opensuse.org"
role = "packages-only"

[[obs.package_sources]]
project = "home:rodrigosbrito:lyra"
repository = "openSUSE_Leap_16.0"

[[obs.package_sources]]
project = "home:rodrigosbrito:vega"
repository = "openSUSE_Leap_16.0"

# No home:rodrigosbrito:fina (Fina is desktop-only) and no
# Virtualization:Appliances:Builder (desktop image test tooling only) -
# see docs/server-edition.md.

[artifacts]
required = [
  "iso",
  "packages",
  "verified",
  "report",
  "checksum",
  "checksum_signature",
  "cyclonedx_sbom",
  "spdx_sbom",
]

[evidence]
# Formal JSON test evidence is not a publication requirement. Release
# integrity remains enforced by the clean-source manifest, signed checksum,
# P0/P1 blocker query and post-upload download verification.
required_test_results = []
