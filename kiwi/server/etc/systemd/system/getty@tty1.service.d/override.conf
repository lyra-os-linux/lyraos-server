# Autologin as root on the console for the Lyra OS Server live session.
# There is no GDM/graphical session on this profile to autolog into
# (contrast with the desktop's liveuser GDM autologin, config.sh); root's
# encrypted password stays locked in kiwi/config.xml, same as it does for
# the desktop's liveuser - agetty --autologin bypasses PAM authentication
# entirely, so the lock does not block it. /root/.bash_profile runs the
# console installer once this logs in.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
